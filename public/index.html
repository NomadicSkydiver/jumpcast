:root{
  --bg:#07111f;
  --card:#0d1b2d;
  --card2:#0a1728;
  --text:#f5f8fc;
  --muted:#91a4ba;
  --accent:#65d6ff;
  --good:#65e6a2;
  --warn:#ffd166;
  --bad:#ff6b6b;
  --line:#1b3048;
}

*{
  box-sizing:border-box;
}

html{

}

body{

      #07111f
    );
  color:var(--text);

}

.app{

}

.brand{

  letter-spacing:-1px;
}

.brand span{

.tag{

.label{

  font-weight:900;
  letter-spacing:1px;
  text-transform:uppercase;
}

.controls{
  display:grid;
  grid-template-columns:1.1fr 1fr;
  gap:10px;
  margin-top:10px;
}

select,
input{

  min-width:0;
  padding:14px 12px;

  background:#14263c;
  color:white;
  font-size:16px;
}

}

.altNumber{
  margin-top:4px;

.altUnit{

  font-weight:800;
}

.hero{
  display:flex;
  justify-content:space-between;

}

.heroTitle{
  margin-top:5px;

  font-weight:950;
}

.heroSub{
  margin-top:5px;
  color:var(--muted);
  font-size:12px;
  line-height:1.5;
}

.wind{
  min-width:120px;
  text-align:right;
}

.windNumber{
  font-size:42px;
  line-height:.95;
  font-weight:950;
}

.windUnit{
  margin-top:4px;

  font-size:11px;

}

.windDirection{
  margin-top:6px;
  color:var(--accent);
  font-size:18px;
  font-weight:950;
}

.windDegrees{
  color:var(--muted);
  font-size:11px;
}

}

.profileDirection{
  color:var(--accent);
  font-weight:900;
}
