name: Build JumpCast Android App

on:
  workflow_dispatch:
  push:
    paths:
      - 'JumpCast_Android_App_Project.zip'
      - '.github/workflows/android.yml'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Extract Android project
        run: |
          rm -rf android
          unzip -q JumpCast_Android_App_Project.zip
          mv jumpcast-android android

      - name: Build JumpCast APK
        run: |
          gradle -p android assembleDebug --no-daemon

      - name: Upload JumpCast APK
        uses: actions/upload-artifact@v4
        with:
          name: JumpCast-Android-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
